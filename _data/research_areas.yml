# `url` is the permalink of the detail page in _pages/research/.
# Vignette: set `image` (path under assets/), or `video` plus a `poster` image shown while it loads.
- title: Dynamical Systems
  icon: fa-solid fa-wave-square
  url: /research/dynamical-systems/
  video: /assets/video/vortex-tubes.mp4
